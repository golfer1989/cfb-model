name: Daily CFB report

on:
  schedule:
    # Off the top of the hour on purpose: GitHub documents :00 as its peak
    # load and drops/delays scheduled runs then. Measured Oct 2026: of 34
    # firings/day requested, ~5 actually ran. Picks no longer depend on any
    # single firing landing on time (24h lock window + refresh), so these
    # are best-effort refresh chances, all day.
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Should this firing build?
        id: guard
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import csv, os, datetime as dt
          from zoneinfo import ZoneInfo
          CT = ZoneInfo("America/Chicago")
          now = dt.datetime.now(dt.timezone.utc)
          now_ct = now.astimezone(CT)
          manual = os.environ.get("GITHUB_EVENT_NAME") != "schedule"
          # Morning run: grades yesterday, refreshes Results, previews today.
          # NOT gated to a 15-minute window -- GitHub fires :00 crons 15-40
          # minutes late routinely, which silently skipped the morning build
          # seven days straight. Instead: the FIRST firing at/after 8am CT
          # that finds no marker for today builds, whenever it lands, and a
          # failed attempt retries on the next firing until one succeeds.
          today_ct = now_ct.strftime("%Y-%m-%d")
          done = ""
          try:
              with open("data/last_morning.txt") as f:
                  done = f.read().strip()
          except FileNotFoundError:
              pass
          morning = now_ct.hour >= 8 and done != today_ct
          # Build when (a) any FBS-vs-FBS game kicking off in the next 24h
          # has no pick yet -- guarantees coverage even though GitHub runs
          # only a fraction of scheduled firings -- or (b) any such game kicks
          # off within 90 min -- refreshes its pick with near-closing lines
          # and late injury news. Picks are never written after kickoff.
          locked = set()
          try:
              with open("data/ledger.csv") as f:
                  for r in csv.DictReader(f):
                      locked.add(str(r.get("event_id") or "").strip())
          except FileNotFoundError:
              pass
          prewave = False
          # only FBS-vs-FBS games get picks, so only they warrant a build
          FBS = {"SEC", "Big Ten", "Big 12", "ACC", "American", "Sun Belt",
                 "MAC", "CUSA", "Mountain West", "Pac-12", "FBS Indep."}
          try:
              with open("data/schedule_2026.csv") as f:
                  for r in csv.DictReader(f):
                      if r.get("status") == "STATUS_FINAL":
                          continue
                      if r.get("home_conf") not in FBS or r.get("away_conf") not in FBS:
                          continue
                      try:
                          t = dt.datetime.strptime(
                              r.get("kickoff_utc") or "",
                              "%Y-%m-%dT%H:%MZ").replace(tzinfo=dt.timezone.utc)
                      except ValueError:
                          continue
                      mins = (t - now).total_seconds() / 60
                      if mins <= 0:
                          continue
                      unpicked = str(r.get("event_id") or "").strip() not in locked
                      if mins <= 90 or (unpicked and mins <= 1440):
                          prewave = True
                          break
          except FileNotFoundError:
              pass
          go = manual or morning or prewave
          why = ("manual" if manual else "morning" if morning
                 else "pre-kickoff" if prewave else "off-cycle")
          print(f"go={'yes' if go else 'no'}")
          print(f"why={why}")
          EOF

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.go == 'yes'
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        if: steps.guard.outputs.go == 'yes'
        run: pip install -r requirements.txt

      - name: Refresh model + build today's report
        if: steps.guard.outputs.go == 'yes'
        env:
          REPORT_DAYS: "1"
          REPORT_LOCK_HOURS: "24"
          REPORT_REFRESH_PICKS: "1"
          DATA_SOURCE: cfbd
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python daily_web.py

      - name: Mark today's morning run done
        if: steps.guard.outputs.go == 'yes' && steps.guard.outputs.why == 'morning'
        run: TZ=America/Chicago date '+%Y-%m-%d' > data/last_morning.txt

      - name: Save updated data and publish the page
        if: steps.guard.outputs.go == 'yes'
        run: |
          git config user.name  "cfb-model-bot"
          git config user.email "cfb-model-bot@users.noreply.github.com"
          git add data docs
          git commit -m "Report (${{ steps.guard.outputs.why }}): $(TZ=America/Chicago date '+%Y-%m-%d %H:%M %Z')" \
            || echo "nothing changed"
          git push

      - name: Note skipped firing
        if: steps.guard.outputs.go != 'yes'
        run: echo "Off-cycle check - no build needed right now."
